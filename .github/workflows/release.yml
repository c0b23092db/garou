name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/siv.exe, README.md, LICENSE -DestinationPath garou-${{ matrix.target }}.zip
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf garou-${{ matrix.target }}.tar.gz README.md LICENSE -C target/${{ matrix.target }}/release siv

      - uses: softprops/action-gh-release@v2
        with:
          files: garou-${{ matrix.target }}.*
