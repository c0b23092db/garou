[package]
name = "garou"
version = "1.4.0"
description = "TUI: Simple Image Protocol Viewer for Kitty Graphics Protocol"
keywords = ["tui","viewer","image-viewer","kitty","graphics"]
categories = ["command-line-utilities", "visualization", "graphics"]
license = "MIT"
edition = "2024"
readme = "README.md"
authors = ["ikata"]
repository = "https://github.com/c0b23092db/garou"
include = [
  "/src/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/config/**",
  "/README.md",
  "/README/png.png",
  "/LICENSE",
]

[[bin]]
name = "siv"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
base64 = "0.23"
image = "0.25.10"
toml = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
open = "5"
unicode-width = "0.2"
dirs = "7"
libc = "0.2"
trash = "5.2.9"
